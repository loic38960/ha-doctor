name: HA Doctor unit-test diagnostics

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client

      - name: Capture unit-test output
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/ha-doctor-unit-tests.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-doctor-unit-test-log
          path: /tmp/ha-doctor-unit-tests.txt
          if-no-files-found: error
