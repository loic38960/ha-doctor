name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile ha_doctor/*.py
      - name: Validate 0.8 UI compatibility markers
        run: |
          grep -q "Vue d'ensemble" ha_doctor/static/index.html
          grep -q "Architecture" ha_doctor/static/index.html
          grep -q "Qualité & confidentialité" ha_doctor/static/index.html
          grep -q "Score V4" ha_doctor/static/index.html
      - name: Validate version consistency
        run: |
          grep -q 'version: "0.8.0"' ha_doctor/config.yaml
          grep -q 'VERSION = "0.8.0"' ha_doctor/app_v080.py
          grep -q 'VERSION = "0.8.0"' ha_doctor/scanner_v080.py
          grep -q 'VERSION = "0.8.0"' ha_doctor/intelligence_v080.py
          grep -q 'Starting HA Doctor 0.8.0' ha_doctor/run.sh
          grep -q 'app_v080.py' ha_doctor/run.sh
      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.8.0 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor
      - name: Verify packaged modules exist
        run: |
          docker run --rm --entrypoint sh ha-doctor-ci -c 'test -f /app/scanner_v080.py && test -f /app/intelligence_v080.py && test -f /app/flow_v080.py && test -f /app/app_v080.py && test -f /app/intelligence_v070.py && test -f /app/temporal_v060.py && test -f /app/share_export.py'
      - name: Smoke test packaged Python imports
        run: |
          docker run --rm --entrypoint python3 ha-doctor-ci -c "import app_v080, scanner_v080, intelligence_v080, flow_v080, share_export; assert app_v080.VERSION == '0.8.0'; assert scanner_v080.VERSION == '0.8.0'; print('HA Doctor 0.8 packaged imports OK', app_v080.VERSION)"
      - name: Smoke test packaged web assets
        run: |
          docker run --rm --entrypoint python3 ha-doctor-ci -c "from pathlib import Path; p=Path('/app/static/index.html'); assert p.exists(); t=p.read_text(); assert 'Architecture' in t and 'Qualité & confidentialité' in t; print('HA Doctor UI packaged OK')"
