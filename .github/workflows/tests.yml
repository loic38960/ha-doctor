name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile ha_doctor/*.py
      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.4.0 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor
