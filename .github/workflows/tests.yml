name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client

      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v

      - name: Compile every Python source
        run: python -m py_compile ha_doctor/*.py

      - name: Validate 0.11 UI and JavaScript stack
        run: |
          PYTHONPATH=ha_doctor python - <<'PY'
          from pathlib import Path
          import app_v080, app_v082, app_v083, app_v084, app_v085, app_v086, app_v087, app_v088, app_v090, app_v100, app_v110
          source = Path('ha_doctor/static/index.html').read_text(encoding='utf-8')
          enhanced = app_v110.enhance_ui_v110(source)
          for marker in (
              "Vue d'ensemble", "Architecture", "Qualité & confidentialité",
              "HA Doctor 0.10 · Engine Candidate", "HA Doctor 0.11 · Cross-Validated Engine",
              "Rapport support · compact", "Résumé lisible",
          ):
              assert marker in enhanced, marker
          assert app_v110.VERSION == '0.11.0'
          Path('/tmp/ha-doctor-v110-ui.js').write_text(
              app_v080.UI_PATCH_JS + '\n' + app_v082.UI_PATCH_V082 + '\n' + app_v083.UI_PATCH_V083 + '\n' +
              app_v084.UI_PATCH_V084 + '\n' + app_v085.UI_PATCH_V085 + '\n' + app_v086.UI_PATCH_V086 + '\n' +
              app_v087.UI_PATCH_V087 + '\n' + app_v088.UI_PATCH_V088 + '\n' + app_v090.UI_PATCH_V090 + '\n' +
              app_v100.UI_PATCH_V100 + '\n' + app_v110.UI_PATCH_V110,
              encoding='utf-8')
          PY
          node --check /tmp/ha-doctor-v110-ui.js

      - name: Validate 0.11 version contracts
        run: |
          grep -q 'version: "0.11.0"' ha_doctor/config.yaml
          grep -q 'VERSION = "0.11.0"' ha_doctor/contracts_v110.py
          grep -q 'app_v110.py' ha_doctor/run.sh
          grep -q 'Starting HA Doctor 0.11.0' ha_doctor/run.sh
          PYTHONPATH=ha_doctor python - <<'PY'
          import contracts_v110, app_v110
          assert contracts_v110.VERSION == app_v110.VERSION == '0.11.0'
          assert contracts_v110.REPORT_SCHEMA == 'ha-doctor-report/0.11'
          assert contracts_v110.SHARE_SCHEMA == 'ha-doctor-share/5'
          PY

      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.11.0 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor

      - name: Verify Cross-Validated modules in image
        run: |
          docker run --rm --entrypoint sh ha-doctor-ci -c \
            'test -f /app/app_v110.py && test -f /app/scanner_v110.py && test -f /app/contracts_v110.py &&
             test -f /app/product_v110.py && test -f /app/selfcheck_v110.py && test -f /app/sharing_v110.py &&
             test -f /app/finalize_v110.py && test -f /app/semantics_v100.py && test -f /app/resilience_v100.py'
          docker run --rm --entrypoint python3 ha-doctor-ci -c \
            "import contracts_v110, app_v110, scanner_v110, product_v110, selfcheck_v110, sharing_v110; assert contracts_v110.VERSION == '0.11.0'; print('0.11 packaged imports OK')"

      - name: Smoke test real-report regressions
        run: |
          docker run --rm -i --entrypoint python3 ha-doctor-ci - <<'PY'
          from product_v110 import finding_evidence_count, _security, _maintenance, _single_snapshot_evidence
          r={'findings':[
            {'rule_id':'HD-SEC-001','examples':[{}, {}, {}]},
            {'rule_id':'HD-SEC-003','examples':[{}]*8},
            {'rule_id':'HD-CFG-001','examples':[{}]*7},
            {'rule_id':'HD-REG-002','summary':'29 entité(s) locales','examples':[{}]*12},
          ],'registry_analysis':{'orphan_analysis':{}},'scan_performance':{'single_state_snapshot_preserved':True}}
          assert finding_evidence_count(r['findings'][0]) == 3
          assert finding_evidence_count(r['findings'][3]) == 29
          assert _security(r)['active_secret_hint_count'] == 3
          assert _security(r)['archive_secret_hint_count'] == 8
          assert _maintenance(r)['missing_reference_count'] == 7
          assert _maintenance(r)['local_unavailable_review'] == 29
          assert _single_snapshot_evidence(r) is True
          print('0.11 real-report regressions OK')
          PY

      - name: Runtime smoke test 0.11 API
        run: |
          set -euo pipefail
          cleanup(){ docker logs ha-doctor-ci-runtime || true; docker rm -f ha-doctor-ci-runtime >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name ha-doctor-ci-runtime -e HA_DOCTOR_SCAN_ON_START=false -p 127.0.0.1:18099:8099 --entrypoint python3 ha-doctor-ci /app/app_v110.py
          ok=0; for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:18099/health >/tmp/health.json; then ok=1; break; fi; sleep 1; done; test "$ok" -eq 1
          curl -fsS http://127.0.0.1:18099/api/version -o /tmp/version.json
          grep -q '"0.11.0"' /tmp/version.json
          grep -q '"ha-doctor-share/5"' /tmp/version.json
