name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client

      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v

      - name: Compile every Python source
        run: python -m py_compile ha_doctor/*.py

      - name: Validate 0.16.1 UI and contracts
        run: |
          PYTHONPATH=ha_doctor python - <<'PY'
          from pathlib import Path
          import app_v160, contracts_v160
          source=Path('ha_doctor/static/index.html').read_text(encoding='utf-8')
          enhanced=app_v160.enhance_ui_v160(source)
          assert 'HA Doctor 0.16 · Evidence Precision Engine' in enhanced
          assert app_v160.VERSION == contracts_v160.VERSION == '0.16.1'
          assert contracts_v160.REPORT_SCHEMA == 'ha-doctor-report/0.16'
          assert contracts_v160.SHARE_SCHEMA == 'ha-doctor-share/10'
          assert contracts_v160.SHARE_TARGET_BYTES == 20000
          assert contracts_v160.SHARE_HARD_BYTES == 24000
          assert contracts_v160.REPAIR_PLAYBOOK_MODEL == 'repair_playbook_v4_precision_evidence'
          PY
          grep -q 'version: "0.16.1"' ha_doctor/config.yaml
          grep -q 'Starting HA Doctor 0.16.1' ha_doctor/run.sh
          grep -q 'app_v160.py' ha_doctor/run.sh

      - name: Enforce hotfix pipeline architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          scanner=Path('ha_doctor/scanner_v160.py').read_text()
          hotfix=Path('ha_doctor/hotfix_v161.py').read_text()
          sharing=Path('ha_doctor/sharing_v161.py').read_text()
          assert 'apply_hotfix_v161(report)' in scanner
          assert scanner.index('apply_product_intelligence_v8(report)') < scanner.index('apply_hotfix_v161(report)') < scanner.index('stage_publication(report)')
          assert 'selfcheck_module.build_share_report = build_share_report_v161' in scanner
          assert 'sharing_module.build_share_report = build_share_report_v161' in scanner
          assert 'REPAIR_PLAYBOOK_MODEL' in hotfix
          assert 'weak_pre_control_risk_count' in hotfix
          assert 'preserved_by_action_plan_order' in sharing
          assert 'v161_duplicate_truth_compaction' in sharing
          print('0.16.1 publication hotfix architecture OK')
          PY

      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.16.1 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor

      - name: Verify packaged hotfix modules
        run: |
          docker run --rm --entrypoint sh ha-doctor-ci -c 'test -f /app/app_v160.py && test -f /app/scanner_v160.py && test -f /app/hotfix_v161.py && test -f /app/sharing_v161.py && test -f /app/selfcheck_v160.py && test -f /app/temporal_v160.py'
          docker run --rm --entrypoint python3 ha-doctor-ci -c "import contracts_v160,app_v160,scanner_v160,hotfix_v161,sharing_v161; assert contracts_v160.VERSION=='0.16.1'; print('0.16.1 packaged imports OK')"

      - name: Smoke test precision invariants and Share target
        run: |
          docker run --rm -i --entrypoint python3 ha-doctor-ci - <<'PY'
          from semantics_v160 import build_controller_impact_v2
          from hotfix_v161 import apply_hotfix_v161
          from sharing_v161 import build_share_report
          from contracts_v160 import *

          sem={'unproven_pairs':[{'entity_id':'switch.boost','automations':['Solar','Low'],'target_kind':'actuator'},{'entity_id':'input_boolean.guard','automations':['Solar','Release'],'target_kind':'helper'}]}
          scope=build_controller_impact_v2(sem)
          assert scope['physical_pair_count']==1 and scope['impacted_automation_count']==2

          report={
            'decision_engine':{'items':[{'id':f'A{i}','repair_playbook':{'model':'legacy','repair_readiness':'needs_logic_review','steps':[{'step':1,'detail':'x'}]}} for i in range(16)]},
            'action_plan':{'model':ACTION_PLAN_MODEL,'total':16,'items':[{'id':f'A{i}','title':f'Action {i}','priority':'verify','severity':'low','domain':'test','confidence':'high','source_type':'finding','source_id':f'F{i%15}','operational_lane':'logic_review','operational_relevance':'medium','execution_priority_score':50,'dependency_impact':{'level':'low','impacted_automation_count':0}} for i in range(16)]},
            'resilience_recommendations':{'model':RESILIENCE_RECOMMENDATION_MODEL,'analysis_model':RESILIENCE_MODEL,'items':[
              {'entity_id':'sensor.pool','tier':'must_fix','phase_evidence':[{'phase':'pre_control_decision','protection':'none'}]},
              {'entity_id':'sensor.eco','tier':'hardening','phase_evidence':[{'phase':'pre_control_decision','protection':'weak'}]},
            ]},
            'generated_at':'2026-08-11T09:00:00Z','scores':{'global':77},
            'findings':[{'rule_id':f'F{i}','title':f'Finding {i}','severity':'low','domain':'test','priority':'verify'} for i in range(15)],
            'diagnostic_summary':{'source':ACTION_PLAN_SOURCE},
            'condition_semantics':{'model':CONDITION_MODEL,'unproven_pairs':[]},
            'controller_impact':{'model':CONTROLLER_IMPACT_MODEL},
            'duplicate_action_semantics':{'model':DUPLICATE_MODEL,'count':0,'items':[]},
            'automation_feedback_semantics':{'model':LOOP_MODEL,'count':0,'items':[]},
            'temporal_analysis':{'model':TEMPORAL_MODEL,'history_contract':HISTORY_CONTRACT,'history_policy':HISTORY_POLICY,'publication_model':PUBLICATION_MODEL},
            'product_intelligence':{'model':'x','public_contract_truth':{'model':'x','version_fresh':True,'decision_item_identity':True,'canonical_order_identity':True,'precision_models_present':True}},
            'doctor_view':{'model':PRODUCT_MODEL,'trust':{'model':TRUST_MODEL,'score':90,'level':'high','read_only':True}},
            'quality_gates':{},'self_check':{'model':SELF_CHECK_MODEL,'status':'pass','failures':[],'warnings':[]},
            'report_schema':{'version':REPORT_SCHEMA,'capabilities':[]},
          }
          report['decision_engine'].update({'model':DECISION_MODEL,'total':16,'primary_action_count':16,'lane_counts':{'logic_review':16},'canonical_order':{'model':CANONICAL_ORDER_MODEL,'item_ids':[f'A{i}' for i in range(16)]},'top':[]})
          apply_hotfix_v161(report)
          assert all(x['repair_playbook']['model']==REPAIR_PLAYBOOK_MODEL for x in report['decision_engine']['items'])
          assert report['resilience_recommendations']['items'][0]['pre_control_risk_count']==1
          assert report['resilience_recommendations']['items'][1]['pre_control_risk_count']==0
          assert report['resilience_recommendations']['items'][1]['weak_pre_control_risk_count']==1
          share=build_share_report(report); meta=share['export_meta']
          assert meta['within_target_bytes'], meta['share_report_bytes_estimate']
          assert meta['within_hard_bytes'] and meta['all_action_identities_preserved'] and meta['all_finding_identities_preserved']
          print('Hotfix precision + Share target OK', meta['share_report_bytes_estimate'])
          PY

      - name: Smoke test publication identity
        run: |
          docker run --rm -i --entrypoint python3 ha-doctor-ci - <<'PY'
          import os,tempfile
          from temporal_v060 import save_history,load_history
          from temporal_v160 import stage_publication,commit_publication,validate_current_snapshot,refresh_published_baseline_visibility
          from contracts_v160 import VERSION,REPORT_SCHEMA,ACTION_PLAN_MODEL,ACTION_PLAN_SOURCE,DECISION_MODEL,CONDITION_MODEL,HISTORY_CONTRACT
          f=tempfile.NamedTemporaryFile(delete=False); path=f.name; f.close(); os.unlink(path)
          save_history([{'generated_at':'2026-08-11T09:00:00Z','active_ids':[]}],path)
          r={'generated_at':'2026-08-11T09:00:00Z','scores':{'global':77},'score_v5_preview':{'v5_preview_score':78},'action_plan':{'model':ACTION_PLAN_MODEL},'diagnostic_summary':{'source':ACTION_PLAN_SOURCE},'decision_engine':{'model':DECISION_MODEL},'condition_semantics':{'model':CONDITION_MODEL},'self_check':{'status':'pass'}}
          stage_publication(r,path); assert validate_current_snapshot(r,path,require_published=False)['valid']
          commit_publication(r,path); assert validate_current_snapshot(r,path,require_published=True)['valid']
          vis=refresh_published_baseline_visibility(r,path); snap=load_history(path)[-1]
          assert vis['current_committed_baseline'] and snap['report_version']==VERSION=='0.16.1'
          assert snap['report_schema']==REPORT_SCHEMA and snap['score_contract']==HISTORY_CONTRACT and snap['final_primary_score']==77
          os.unlink(path)
          print('0.16.1 publication identity OK')
          PY

      - name: Runtime smoke test 0.16.1 API
        run: |
          set -euo pipefail
          cleanup(){ docker logs ha-doctor-ci-runtime || true; docker rm -f ha-doctor-ci-runtime >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name ha-doctor-ci-runtime -e HA_DOCTOR_SCAN_ON_START=false -p 127.0.0.1:18099:8099 --entrypoint python3 ha-doctor-ci /app/app_v160.py
          ok=0; for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:18099/health >/tmp/health.json; then ok=1; break; fi; sleep 1; done; test "$ok" -eq 1
          curl -fsS http://127.0.0.1:18099/api/version -o /tmp/version.json
          grep -q '"0.16.1"' /tmp/version.json
          grep -q '"ha-doctor-share/10"' /tmp/version.json
          grep -q '"decision_engine_v4_precision_board"' /tmp/version.json
          grep -q '"condition_semantics_v11_evidence_precision"' /tmp/version.json
          grep -q '"controller_impact_v2_unresolved_scope"' /tmp/version.json
