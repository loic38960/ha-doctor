name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m py_compile ha_doctor/*.py

      - name: Validate 0.8 UI compatibility markers
        run: |
          grep -q "Vue d'ensemble" ha_doctor/static/index.html
          grep -q "Architecture" ha_doctor/static/index.html
          grep -q "Qualité & confidentialité" ha_doctor/static/index.html
          grep -q "Score V4" ha_doctor/static/index.html

      - name: Validate 0.8.5 runtime UI compatibility
        run: |
          PYTHONPATH=ha_doctor python - <<'PY'
          from pathlib import Path
          import app_v080, app_v082, app_v083, app_v084, app_v085
          source = Path('ha_doctor/static/index.html').read_text(encoding='utf-8')
          enhanced = app_v085.enhance_ui_v085(source)
          assert '__HA_DOCTOR_VERSION__' not in enhanced
          assert 'Entity Flow V3' in enhanced
          assert 'Calibration 0.8.2' in enhanced
          assert 'Hardening 0.8.3' in enhanced
          assert 'Semantic Lineage 0.8.4' in enhanced
          assert 'Branch Intelligence 0.8.5' in enhanced
          assert 'Validation 0.8.5' in enhanced
          assert app_v085.VERSION == '0.8.5'
          Path('/tmp/ha-doctor-v085-ui.js').write_text(
              app_v080.UI_PATCH_JS + '\n' + app_v082.UI_PATCH_V082 + '\n' + app_v083.UI_PATCH_V083 + '\n' + app_v084.UI_PATCH_V084 + '\n' + app_v085.UI_PATCH_V085,
              encoding='utf-8',
          )
          print('HA Doctor 0.8.5 runtime/UI compatibility OK')
          PY
          node --check /tmp/ha-doctor-v085-ui.js

      - name: Validate version consistency
        run: |
          grep -q 'version: "0.8.5"' ha_doctor/config.yaml
          grep -q 'VERSION = "0.8.5"' ha_doctor/app_v085.py
          grep -q 'VERSION = "0.8.5"' ha_doctor/scanner_v085.py
          grep -q 'VERSION = "0.8.5"' ha_doctor/intelligence_v085.py
          grep -q 'VERSION = "0.8.5"' ha_doctor/intelligence_v085_fixed.py
          grep -q 'VERSION = "0.8.5"' ha_doctor/semantics_v085.py
          grep -q 'VERSION = "0.8.5"' ha_doctor/semantics_v085_fixed.py
          grep -q 'VERSION = "0.8.5"' ha_doctor/consistency_v085.py
          grep -q 'Starting HA Doctor 0.8.5' ha_doctor/run.sh
          grep -q 'app_v085.py' ha_doctor/run.sh

      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.8.5 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor

      - name: Verify packaged 0.8.5 modules exist
        run: |
          docker run --rm --entrypoint sh ha-doctor-ci -c \
            'test -f /app/scanner_v085.py &&
             test -f /app/intelligence_v085.py &&
             test -f /app/intelligence_v085_fixed.py &&
             test -f /app/semantics_v085.py &&
             test -f /app/semantics_v085_fixed.py &&
             test -f /app/consistency_v085.py &&
             test -f /app/app_v085.py'

      - name: Smoke test packaged Python imports
        run: |
          docker run --rm --entrypoint python3 ha-doctor-ci -c \
            "import app_v085, scanner_v085, intelligence_v085, intelligence_v085_fixed, semantics_v085, semantics_v085_fixed, consistency_v085; assert app_v085.VERSION == '0.8.5'; assert scanner_v085.VERSION == '0.8.5'; print('HA Doctor 0.8.5 packaged imports OK')"

      - name: Smoke test packaged web assets
        run: |
          docker run --rm --entrypoint python3 ha-doctor-ci -c \
            "from pathlib import Path; import app_v085; p=Path('/app/static/index.html'); assert p.exists(); t=app_v085.enhance_ui_v085(p.read_text()); assert 'Architecture' in t and 'Qualité & confidentialité' in t and 'Branch Intelligence 0.8.5' in t; print('HA Doctor 0.8.5 UI packaged OK')"

      - name: Runtime smoke test /health
        run: |
          set -euo pipefail
          cleanup() {
            docker logs ha-doctor-ci-runtime || true
            docker rm -f ha-doctor-ci-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name ha-doctor-ci-runtime \
            -e HA_DOCTOR_SCAN_ON_START=false \
            -p 127.0.0.1:18099:8099 \
            --entrypoint python3 ha-doctor-ci /app/app_v085.py
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18099/health >/tmp/ha-doctor-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1
          grep -q '"ok"' /tmp/ha-doctor-health.json
          echo "HA Doctor 0.8.5 /health runtime smoke OK"

      - name: Runtime smoke test branch-aware modules
        run: |
          docker run --rm -i --entrypoint python3 ha-doctor-ci - <<'PY'
          from consistency_v085 import validate_report_consistency_v5
          from semantics_v085_fixed import resolve_branch_pair

          sender = {"effective": {"action": [
              {"service": "input_boolean.turn_on", "target": {"entity_id": "input_boolean.priority"}},
              {"service": "switch.turn_off", "target": {"entity_id": "switch.pump"}},
          ]}}
          receiver = {"effective": {
              "trigger": [{"platform": "state", "entity_id": "input_boolean.priority", "from": "on", "to": "off"}],
              "condition": [{"condition": "state", "entity_id": "input_boolean.priority", "state": "off"}],
              "action": [{"service": "switch.turn_on", "target": {"entity_id": "switch.pump"}}],
          }}
          assert resolve_branch_pair(sender, receiver, "switch.pump") is not None

          report = {
              "version": "0.8.5",
              "report_schema": {"version": "ha-doctor-report/0.8.5"},
              "action_plan": {"total": 0, "displayed": 0, "remaining": 0, "counts": {"action_now": 0, "verify": 0, "optimize": 0}, "items": []},
              "recommendation_queue": {"total": 0, "items": []},
              "diagnostic_summary": {"priority_counts": {"action_now": 0, "verify": 0, "optimize": 0}},
              "root_cause_summary": {"actionable_registry_incidents": 0},
              "flow_confidence": {"model": "flow_confidence_v3.1", "low_confidence_dynamic_edges": 0, "review_required_dynamic_edges": 0},
              "dependency_graph_meta": {"confidence_model": "flow_confidence_v3.1", "low_confidence_dynamic_edges": 0, "review_required_dynamic_edges": 0},
              "architecture_analysis": {"model": "architecture_v3_post_flow", "post_flow_recomputed": True},
              "condition_semantics": {"unproven_pair_count": 0, "unproven_pairs": [], "physical_unproven_pair_count": 0},
              "temporal_analysis": {"resolved_since_previous": [], "deescalated_since_previous": []},
              "entity_lineage": {"parse_error_count": 0, "raw_yaml_persisted": False, "secret_values_persisted": False},
              "diagnostic_explanations": [],
              "score_meta": {"penalty_total": 0, "penalty_breakdown": []},
              "privacy": {},
          }
          result = validate_report_consistency_v5(report)
          assert result["status"] == "pass", result
          print("HA Doctor 0.8.5 branch-aware smoke OK")
          PY
