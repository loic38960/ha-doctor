name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      - name: Compile every Python source
        run: python -m py_compile ha_doctor/*.py

      - name: Validate 0.13 UI and contracts
        run: |
          PYTHONPATH=ha_doctor python - <<'PY'
          from pathlib import Path
          import app_v080, app_v082, app_v083, app_v084, app_v085, app_v086, app_v087, app_v088, app_v090, app_v100, app_v110, app_v120, app_v130, contracts_v130
          source=Path('ha_doctor/static/index.html').read_text(encoding='utf-8')
          enhanced=app_v130.enhance_ui_v130(source)
          assert 'HA Doctor 0.13 · Decision Engine' in enhanced
          assert app_v130.VERSION == contracts_v130.VERSION == '0.13.0'
          assert contracts_v130.REPORT_SCHEMA == 'ha-doctor-report/0.13'
          assert contracts_v130.SHARE_SCHEMA == 'ha-doctor-share/7'
          assert contracts_v130.DECISION_MODEL == 'decision_engine_v1_evidence_playbooks'
          assert contracts_v130.CONDITION_MODEL == 'condition_semantics_v8_mandatory_guard_matrix'
          assert contracts_v130.HISTORY_CONTRACT == 'published_primary_score_v1'
          Path('/tmp/ha-doctor-v130-ui.js').write_text(app_v080.UI_PATCH_JS+'\n'+app_v082.UI_PATCH_V082+'\n'+app_v083.UI_PATCH_V083+'\n'+app_v084.UI_PATCH_V084+'\n'+app_v085.UI_PATCH_V085+'\n'+app_v086.UI_PATCH_V086+'\n'+app_v087.UI_PATCH_V087+'\n'+app_v088.UI_PATCH_V088+'\n'+app_v090.UI_PATCH_V090+'\n'+app_v100.UI_PATCH_V100+'\n'+app_v110.UI_PATCH_V110+'\n'+app_v120.UI_PATCH_V120+'\n'+app_v130.UI_PATCH_V130,encoding='utf-8')
          PY
          node --check /tmp/ha-doctor-v130-ui.js
          grep -q 'version: "0.13.0"' ha_doctor/config.yaml
          grep -q 'app_v130.py' ha_doctor/run.sh
          grep -q 'Starting HA Doctor 0.13.0' ha_doctor/run.sh

      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.13.0 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor

      - name: Verify Decision Engine modules
        run: |
          docker run --rm --entrypoint sh ha-doctor-ci -c 'test -f /app/app_v130.py && test -f /app/scanner_v130.py && test -f /app/contracts_v130.py && test -f /app/semantics_v130.py && test -f /app/decision_v130.py && test -f /app/product_v130.py && test -f /app/selfcheck_v130.py && test -f /app/sharing_v130.py && test -f /app/finalize_v130.py && test -f /app/temporal_v130.py'
          docker run --rm --entrypoint python3 ha-doctor-ci -c "import contracts_v130,app_v130,scanner_v130,semantics_v130,decision_v130,product_v130,selfcheck_v130,sharing_v130,temporal_v130; assert contracts_v130.VERSION=='0.13.0'; print('0.13 packaged imports OK')"

      - name: Smoke test V8 guard proof and decision playbooks
        run: |
          docker run --rm -i --entrypoint python3 ha-doctor-ci - <<'PY'
          from semantics_v130 import disjoint_mandatory_guard_evidence
          from decision_v130 import build_decision_engine
          p=disjoint_mandatory_guard_evidence({'input_boolean.phase':{'on'}},{'input_boolean.phase':{'off'}})
          assert len(p)==1 and p[0]['reason']=='mandatory_literal_state_guards_are_disjoint'
          r={'action_plan':{'items':[{'id':'DX-HD-CFG-006','title':'Integral','priority':'action_now','severity':'medium','source_type':'finding','source_id':'HD-CFG-006','confidence':'high','confidence_score':.99,'dependency_impact':{'level':'low','impacted_automation_count':0}}]},'product_intelligence':{'entity_noise':{}}}
          d=build_decision_engine(r)
          assert d['total']==1 and d['ready_for_manual_change_count']==1
          pb=d['items'][0]['repair_playbook']
          assert pb['repair_readiness']=='ready_for_manual_change' and pb['automatic_fix'] is False and pb['steps']
          PY

      - name: Smoke test 0.13 canonical history metadata
        run: |
          docker run --rm -i --entrypoint python3 ha-doctor-ci - <<'PY'
          import os,tempfile
          from temporal_v060 import save_history,load_history
          from temporal_v130 import sync_decision_history,validate_current_decision_snapshot
          from contracts_v130 import ACTION_PLAN_MODEL,ACTION_PLAN_SOURCE,DECISION_MODEL,CONDITION_MODEL
          f=tempfile.NamedTemporaryFile(delete=False); path=f.name; f.close(); os.unlink(path)
          save_history([{'generated_at':'2026-08-11T06:30:00Z','active_ids':[]}],path)
          r={'generated_at':'2026-08-11T06:30:00Z','scores':{'global':75},'score_v5_preview':{'v5_preview_score':76},'action_plan':{'model':ACTION_PLAN_MODEL},'diagnostic_summary':{'source':ACTION_PLAN_SOURCE},'decision_engine':{'model':DECISION_MODEL},'condition_semantics':{'model':CONDITION_MODEL},'self_check':{'status':'pass'}}
          s=sync_decision_history(r,history_path=path,publication_complete=True)
          v=validate_current_decision_snapshot(r,history_path=path)
          assert s['synced'] and v['valid'],(s,v)
          snap=load_history(path)[-1]
          assert snap['report_version']=='0.13.0' and snap['decision_model']==DECISION_MODEL and snap['condition_model']==CONDITION_MODEL
          os.unlink(path)
          PY

      - name: Runtime smoke test 0.13 API
        run: |
          set -euo pipefail
          cleanup(){ docker logs ha-doctor-ci-runtime || true; docker rm -f ha-doctor-ci-runtime >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name ha-doctor-ci-runtime -e HA_DOCTOR_SCAN_ON_START=false -p 127.0.0.1:18099:8099 --entrypoint python3 ha-doctor-ci /app/app_v130.py
          ok=0; for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:18099/health >/tmp/health.json; then ok=1; break; fi; sleep 1; done; test "$ok" -eq 1
          curl -fsS http://127.0.0.1:18099/api/version -o /tmp/version.json
          grep -q '"0.13.0"' /tmp/version.json
          grep -q '"ha-doctor-share/7"' /tmp/version.json
          grep -q '"decision_engine_v1_evidence_playbooks"' /tmp/version.json
          grep -q '"condition_semantics_v8_mandatory_guard_matrix"' /tmp/version.json
