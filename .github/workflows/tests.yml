name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m py_compile ha_doctor/*.py

      - name: Validate 0.8.7 UI and runtime markers
        run: |
          PYTHONPATH=ha_doctor python - <<'PY'
          from pathlib import Path
          import app_v080, app_v082, app_v083, app_v084, app_v085, app_v086, app_v087

          source = Path('ha_doctor/static/index.html').read_text(encoding='utf-8')
          enhanced = app_v087.enhance_ui_v087(source)
          for marker in (
              "Vue d'ensemble",
              "Architecture",
              "Qualité & confidentialité",
              "Score V4",
              "Entity Flow V3",
              "Calibration 0.8.2",
              "Hardening 0.8.3",
              "Semantic Lineage 0.8.4",
              "Branch Intelligence 0.8.5",
              "Partage 0.8.6",
              "Partage 0.8.7",
              "Rapport à envoyer · compact",
              "download-share",
          ):
              assert marker in enhanced, marker
          assert '__HA_DOCTOR_VERSION__' not in enhanced
          assert app_v087.VERSION == '0.8.7'

          Path('/tmp/ha-doctor-v087-ui.js').write_text(
              app_v080.UI_PATCH_JS + '\n' +
              app_v082.UI_PATCH_V082 + '\n' +
              app_v083.UI_PATCH_V083 + '\n' +
              app_v084.UI_PATCH_V084 + '\n' +
              app_v085.UI_PATCH_V085 + '\n' +
              app_v086.UI_PATCH_V086 + '\n' +
              app_v087.UI_PATCH_V087,
              encoding='utf-8',
          )
          print('HA Doctor 0.8.7 runtime/UI compatibility OK')
          PY
          node --check /tmp/ha-doctor-v087-ui.js

      - name: Validate version consistency
        run: |
          grep -q 'version: "0.8.7"' ha_doctor/config.yaml
          grep -q 'VERSION = "0.8.7"' ha_doctor/app_v087.py
          grep -q 'VERSION = "0.8.7"' ha_doctor/scanner_v087.py
          grep -q 'VERSION = "0.8.7"' ha_doctor/sharing_v087.py
          grep -q 'VERSION = "0.8.7"' ha_doctor/hardening_v087.py
          grep -q 'Starting HA Doctor 0.8.7' ha_doctor/run.sh
          grep -q 'app_v087.py' ha_doctor/run.sh

      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.8.7 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor

      - name: Verify packaged modules and imports
        run: |
          docker run --rm --entrypoint sh ha-doctor-ci -c \
            'test -f /app/scanner_v087.py &&
             test -f /app/sharing_v087.py &&
             test -f /app/hardening_v087.py &&
             test -f /app/app_v087.py &&
             test -f /app/scanner_v086.py &&
             test -f /app/scanner_v085.py &&
             test -f /app/intelligence_v085.py &&
             test -f /app/semantics_v085_fixed.py'
          docker run --rm --entrypoint python3 ha-doctor-ci -c \
            "import app_v087, scanner_v087, sharing_v087, hardening_v087; assert app_v087.VERSION == '0.8.7'; assert scanner_v087.VERSION == '0.8.7'; assert sharing_v087.VERSION == '0.8.7'; assert hardening_v087.VERSION == '0.8.7'; print('HA Doctor 0.8.7 packaged imports OK')"

      - name: Smoke test packaged UI
        run: |
          docker run --rm --entrypoint python3 ha-doctor-ci -c \
            "from pathlib import Path; import app_v087; p=Path('/app/static/index.html'); t=app_v087.enhance_ui_v087(p.read_text()); assert 'Rapport à envoyer · compact' in t and 'Partage 0.8.7' in t; print('HA Doctor 0.8.7 UI packaged OK')"

      - name: Runtime smoke test health and share V2
        run: |
          set -euo pipefail
          cat >/tmp/ha-doctor-report.json <<'JSON'
          {
            "product":"HA Doctor",
            "version":"0.8.7",
            "generated_at":"2026-08-10T11:00:00Z",
            "scores":{"global":76},
            "inventory":{"states":1866,"unavailable_count":215,"unknown_count":153},
            "findings":[{"rule_id":"HD-AUTO-009","title":"Double writer","severity":"high","domain":"automations","priority":"action_now","summary":"Two writers","examples":[{"entity_id":"input_number.vb_energy_kwh"}]}],
            "action_plan":{"total":1,"counts":{"action_now":1,"verify":0,"optimize":0},"items":[{"id":"DX-HD-AUTO-009","title":"Double writer","priority":"action_now","severity":"high","domain":"automations","source_type":"finding","source_id":"HD-AUTO-009"}]},
            "dependency_graph":[{"automation":"Huge","references":["sensor.a","sensor.b"]}],
            "registry_analysis":{"integration_health":{"groups":[]},"device_health":{"groups":[]}},
            "entity_health":{"unavailable":{"total":215,"groups":[]},"unknown":{"total":153,"groups":[]}},
            "report_schema":{"version":"ha-doctor-report/0.8.7"}
          }
          JSON

          cleanup() {
            docker logs ha-doctor-ci-runtime || true
            docker rm -f ha-doctor-ci-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name ha-doctor-ci-runtime \
            -e HA_DOCTOR_SCAN_ON_START=false \
            -p 127.0.0.1:18099:8099 \
            -v /tmp/ha-doctor-report.json:/data/report.json:ro \
            --entrypoint python3 ha-doctor-ci /app/app_v087.py

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18099/health >/tmp/ha-doctor-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1
          grep -q '"ok"' /tmp/ha-doctor-health.json
          grep -q '"0.8.7"' /tmp/ha-doctor-health.json

          curl -fsS -D /tmp/share-headers.txt \
            http://127.0.0.1:18099/api/download-share \
            -o /tmp/ha-doctor-share.json
          grep -qi 'filename="ha-doctor-share.json"' /tmp/share-headers.txt
          grep -qi 'X-HA-Doctor-Share-Model: assistant_share_report_v2' /tmp/share-headers.txt

          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/ha-doctor-share.json').read_text(encoding='utf-8'))
          size=Path('/tmp/ha-doctor-share.json').stat().st_size
          assert payload['share_schema']['model'] == 'assistant_share_report_v2'
          assert payload['share_schema']['version'] == 'ha-doctor-share/2'
          assert payload['findings'][0]['rule_id'] == 'HD-AUTO-009'
          assert 'dependency_graph' not in payload
          assert payload['export_meta']['full_dependency_graph_included'] is False
          assert size <= payload['share_schema']['hard_bytes'], (size, payload['share_schema'])
          print(f'HA Doctor 0.8.7 runtime/share OK · {size} bytes')
          PY

      - name: Smoke test controller hardening and branch semantics
        run: |
          docker run --rm -i --entrypoint python3 ha-doctor-ci - <<'PY'
          from hardening_v087 import harden_report_v087
          from semantics_v085_fixed import resolve_branch_pair

          report={
              "version":"0.8.6",
              "scores":{"global":76},
              "condition_semantics":{
                  "unproven_pairs":[
                      {"entity_id":"switch.pump","automations":["A","B"]},
                      {"entity_id":"switch.pump","automations":["A","C"]},
                      {"entity_id":"switch.boost","automations":["D","E"]},
                  ],
                  "physical_unproven_pair_count":3,
                  "helper_unproven_pair_count":0,
                  "other_unproven_pair_count":0,
                  "branch_protocol_resolved_pair_count":2,
              },
              "findings":[{"rule_id":"HD-AUTO-003","summary":"old"}],
              "action_plan":{"items":[{"source_id":"HD-AUTO-003","evidence":[{"type":"summary","label":"Constat","text":"3 entities"}]}]},
              "diagnostic_summary":{},
              "executive_summary":{},
              "score_meta":{},
              "report_schema":{},
              "consistency_analysis":{"status":"pass","checks":{}},
          }
          hardened=harden_report_v087(report)
          summary=hardened['controller_review_summary']
          assert summary['entity_count'] == 2
          assert summary['pair_count'] == 3
          assert hardened['scores']['global'] == 76
          text=hardened['action_plan']['items'][0]['evidence'][0]['text']
          assert '2 entité(s)' in text and '3 paire(s)' in text

          sender={"effective":{"action":[
              {"service":"input_boolean.turn_on","target":{"entity_id":"input_boolean.priority"}},
              {"service":"switch.turn_off","target":{"entity_id":"switch.pump"}},
          ]}}
          receiver={"effective":{
              "trigger":[{"platform":"state","entity_id":"input_boolean.priority","from":"on","to":"off"}],
              "condition":[{"condition":"state","entity_id":"input_boolean.priority","state":"off"}],
              "action":[{"service":"switch.turn_on","target":{"entity_id":"switch.pump"}}],
          }}
          assert resolve_branch_pair(sender, receiver, 'switch.pump') is not None
          print('HA Doctor 0.8.7 hardening/branch smoke OK')
          PY
