name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile ha_doctor/*.py
      - name: Validate 0.8 UI compatibility markers
        run: |
          grep -q "Vue d'ensemble" ha_doctor/static/index.html
          grep -q "Architecture" ha_doctor/static/index.html
          grep -q "Qualité & confidentialité" ha_doctor/static/index.html
          grep -q "Score V4" ha_doctor/static/index.html
      - name: Validate 0.8.2 runtime UI compatibility
        run: |
          PYTHONPATH=ha_doctor python - <<'PY'
          from pathlib import Path
          import app_v080, app_v082
          source = Path('ha_doctor/static/index.html').read_text(encoding='utf-8')
          enhanced = app_v080.enhance_ui_v080(source)
          assert '__HA_DOCTOR_VERSION__' not in enhanced
          assert 'Entity Flow V3' in enhanced
          assert app_v082.VERSION == '0.8.2'
          Path('/tmp/ha-doctor-v082-ui.js').write_text(app_v080.UI_PATCH_JS, encoding='utf-8')
          print('HA Doctor 0.8.2 runtime/UI compatibility OK')
          PY
          node --check /tmp/ha-doctor-v082-ui.js
      - name: Validate version consistency
        run: |
          grep -q 'version: "0.8.2"' ha_doctor/config.yaml
          grep -q 'VERSION = "0.8.2"' ha_doctor/app_v082.py
          grep -q 'VERSION = "0.8.2"' ha_doctor/scanner_v082.py
          grep -q 'VERSION = "0.8.2"' ha_doctor/intelligence_v082.py
          grep -q 'VERSION = "0.8.2"' ha_doctor/semantics_v082.py
          grep -q 'VERSION = "0.8.2"' ha_doctor/resilience_v082.py
          grep -q 'Starting HA Doctor 0.8.2' ha_doctor/run.sh
          grep -q 'app_v082.py' ha_doctor/run.sh
      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.8.2 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor
      - name: Verify packaged modules exist
        run: |
          docker run --rm --entrypoint sh ha-doctor-ci -c 'test -f /app/scanner_v082.py && test -f /app/intelligence_v082.py && test -f /app/semantics_v082.py && test -f /app/resilience_v082.py && test -f /app/app_v082.py && test -f /app/scanner_v081.py && test -f /app/intelligence_v081.py && test -f /app/semantics_v081.py && test -f /app/callgraph_v081.py && test -f /app/snapshot_v081.py && test -f /app/context_v081.py && test -f /app/flow_v080_fixed.py'
      - name: Smoke test packaged Python imports
        run: |
          docker run --rm --entrypoint python3 ha-doctor-ci -c "import app_v082, scanner_v082, intelligence_v082, semantics_v082, resilience_v082; assert app_v082.VERSION == '0.8.2'; assert scanner_v082.VERSION == '0.8.2'; print('HA Doctor 0.8.2 packaged imports OK', app_v082.VERSION)"
      - name: Smoke test packaged web assets
        run: |
          docker run --rm --entrypoint python3 ha-doctor-ci -c "from pathlib import Path; import app_v080, app_v082; p=Path('/app/static/index.html'); assert p.exists(); t=app_v080.enhance_ui_v080(p.read_text()); assert 'Architecture' in t and 'Qualité & confidentialité' in t and 'Entity Flow V3' in t; assert app_v082.VERSION == '0.8.2'; print('HA Doctor 0.8.2 UI packaged OK')"
