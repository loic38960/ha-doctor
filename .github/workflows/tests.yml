name: HA Doctor tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml websocket-client
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile ha_doctor/*.py
      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_VERSION=0.6.2 --build-arg BUILD_ARCH=amd64 -t ha-doctor-ci ha_doctor
      - name: Smoke test packaged Python imports
        run: docker run --rm --entrypoint python3 ha-doctor-ci -c "import app, scanner_v060, temporal_v060, share_export; assert app.VERSION == '0.6.2'; print('HA Doctor packaged imports OK', app.VERSION)"
